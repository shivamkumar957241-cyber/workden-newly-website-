[build]
  command = "npm run build"
  publish = "out"

# Optional redirects for clean URLs (handled by next.config rewrites)
[[redirects]]
  from = "/blogs/:slug"
  to = "/blogs/:slug.html"
  status = 200
  force = true

# Force /blog to /blog/
[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301
  force = true

# Remove old static blog page if accessed
[[redirects]]
  from = "/blog.html"
  to = "/blog/"
  status = 301
  force = true
[[redirects]]
  from = "/apply"
  to = "/apply/"
  status = 301
  force = true
[[redirects]]
  from = "/apply/"
  to = "/apply.html"
  status = 301
  force = true

